[package]
name = "oxideav-svq"
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-svq"
authors = ["Mark Karpeles"]
description = "Pure-Rust Sorenson Video family decoder (SVQ1; SVQ3 planned) for the oxideav framework"

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-svq"
keywords = ["multimedia", "svq", "video", "codec", "quicktime"]
categories = ["multimedia::encoding", "multimedia::video"]

[dependencies]
# `oxideav-core` is gated behind the default-on `registry` feature so
# image / pipeline consumers that only need the frame-header parser can
# depend on `oxideav-svq` with `default-features = false` and skip the
# framework dependency tree entirely. With the feature off, the crate
# exposes only the standalone `parse_frame_header` / `Svq1FrameHeader`
# / `BitReader` surface and never references `oxideav-core`.
oxideav-core = { version = "0.1", optional = true }

[features]
default = ["registry"]

# Wires up the framework `Decoder` trait implementation, the
# `register_codecs` / `register` entry points, and the
# `From<svq::Error> for oxideav_core::Error` conversions against
# `oxideav-core`. Default-on; turn off for consumers that just want the
# standalone SVQ1 frame-header parser.
registry = ["dep:oxideav-core"]
