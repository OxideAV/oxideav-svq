name: CI

# Two CI paths:
#
# * `ci` (default-features) — uses the OxideAV org-level reusable workflow,
#   which exercises the registry-integrated path (oxideav-core dep +
#   Decoder trait impl).
# * `ci-standalone` (no-default-features) — inline job that builds and
#   tests the lib with `--no-default-features`, exercising the
#   `oxideav-core`-free standalone path (frame-header parser only).
#   Catches regressions where the standalone modules accidentally
#   regrow an oxideav-core import.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    uses: OxideAV/.github/.github/workflows/crate-ci.yml@master
    secrets: inherit

  ci-standalone:
    name: Build & test (no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: standalone

      - name: Build (no-default-features)
        run: cargo build --no-default-features --lib --verbose

      - name: Test (no-default-features)
        run: cargo test --no-default-features --lib --verbose

  # Keeps the libFuzzer harness from rotting: the fuzz targets are a
  # detached cargo unit that `cargo clippy --all-targets` at the crate
  # root never sees. Actual fuzz RUNS stay local/bounded (they need a
  # nightly toolchain + cargo-fuzz); CI only proves the harness still
  # compiles and stays formatted.
  fuzz-check:
    name: Type-check fuzz harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-check
          workspaces: fuzz

      - name: Check (fuzz targets compile)
        run: cargo check --manifest-path fuzz/Cargo.toml --verbose

      - name: Format (fuzz targets)
        run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
